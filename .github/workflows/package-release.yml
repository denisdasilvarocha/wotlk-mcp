# npm trusted publishing is bound to this file name; keep it package-release.yml.
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # An App token, unlike GITHUB_TOKEN, lets the release PR trigger CI without approval.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      # Opens or updates the release PR (version bump + CHANGELOG.md); merging it
      # creates the v<version> tag and a draft release.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  # Runs only for the merged release PR. Attaches the npm tarball to the draft
  # release, publishes to npm, then publishes the release; an immutable release
  # cannot take assets later.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: package.json
          registry-url: 'https://registry.npmjs.org'
      - name: Check version and published database
        run: node scripts/check-package-release.mjs "$TAG"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
      - run: vp pack
      - run: vp test tests/release/package-release.test.ts tests/release/package-install.test.ts
      - name: Pack npm tarball
        run: vp pm pack --pack-destination "$RUNNER_TEMP/release"
      # Build provenance for the exact tarball published to npm.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*.tgz
      # The release is still a draft, so a rerun may replace the asset.
      - name: Upload tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/release/*.tgz --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish with npm trusted publishing
        working-directory: ${{ runner.temp }}/release
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          npm publish "$RUNNER_TEMP/release/wotlk-mcp-${TAG#v}.tgz" --ignore-scripts || {
            echo "::error::npm publish failed; verify the package exists and its npm trusted publisher permits this workflow (see docs/releases.md)."
            exit 1
          }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
