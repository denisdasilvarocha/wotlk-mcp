name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
      - name: Check version and published database
        run: node scripts/check-package-release.mjs "$TAG"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
      - run: vp pack
      - run: vp test tests/release/package-release.test.ts tests/release/package-install.test.ts
      - name: Pack npm tarball
        run: vp pm pack --pack-destination "$RUNNER_TEMP/release"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*.tgz
      - name: Upload tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/release/*.tgz --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish with npm trusted publishing
        working-directory: ${{ runner.temp }}/release
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          npm publish "$RUNNER_TEMP/release/wotlk-mcp-${TAG#v}.tgz" --ignore-scripts || {
            echo "::error::npm publish failed; verify the package exists and its npm trusted publisher permits this workflow (see docs/releases.md)."
            exit 1
          }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
