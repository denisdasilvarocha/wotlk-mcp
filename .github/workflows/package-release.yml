name: Publish package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check version and published database
        run: node scripts/check-package-release.mjs "$GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: vp pack
      - run: vp test tests/package-release.test.ts tests/package-install.test.ts
      - name: Publish with npm trusted publishing
        run: |
          vp pm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm publish "./wotlk-mcp-${GITHUB_REF_NAME#v}.tgz" --ignore-scripts || {
            echo "::error::npm publish failed; verify the package exists and its npm trusted publisher permits this workflow (see docs/releases.md)."
            exit 1
          }
      - name: Create GitHub package release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
