name: Database release

on:
  workflow_dispatch:
    inputs:
      allow-shrink:
        description: Explicitly approve count shrinkage over five percent
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'build/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/fixtures/acceptance.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/database-release.yml'

permissions: {}
concurrency:
  group: database-release
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: database-publication
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.create.outputs.tag }}
      digest: ${{ steps.create.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '24.15.0'
      - name: Require provisioned owner authorization
        env:
          DATABASE_RELEASE_AUTHORIZATION: ${{ secrets.DATABASE_RELEASE_AUTHORIZATION }}
        run: test "$DATABASE_RELEASE_AUTHORIZATION" = owner-authorized
      - name: Build complete candidate and verify previous release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          vp run build "$RUNNER_TEMP/candidate"
          node scripts/database-release.mjs previous "$RUNNER_TEMP/previous.sqlite" "$RUNNER_TEMP/versions.json"
      - name: Prepare and validate final candidate
        env:
          ALLOW_SHRINK: ${{ inputs.allow-shrink }}
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/candidate"
          args=("$d" "--used-versions=$RUNNER_TEMP/versions.json")
          if test -f "$RUNNER_TEMP/previous.sqlite"; then args+=("$RUNNER_TEMP/previous.sqlite"); fi
          if test "$ALLOW_SHRINK" = true; then args+=(--allow-shrink); fi
          vpx scripts/prepare-reference.ts "${args[@]}"
      - name: Pack npm tarball
        run: vp pm pack --pack-destination "$RUNNER_TEMP/candidate"
      - name: Create draft and verify uploaded assets
        id: create
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATABASE_RELEASE_AUTHORIZATION: ${{ secrets.DATABASE_RELEASE_AUTHORIZATION }}
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/candidate"
          node scripts/database-release.mjs create "$d/gate.json" "$d/wotlk.sqlite" "$d/wotlk.sqlite.br" "$d/NOTICE.md" "$d/fidelity.json" "$d/build-report.json" "$d/gate.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-tool
          path: ${{ runner.temp }}/candidate/*.tgz
          if-no-files-found: error

  acceptance:
    needs: candidate
    name: acceptance
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24.15.0', 'node']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-manager: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packed-tool
          path: packed-tool
      - name: Download and verify actual draft asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.candidate.outputs.id }}
          RELEASE_DIGEST: ${{ needs.candidate.outputs.digest }}
        run: node scripts/database-release.mjs download "$RELEASE_ID" "$RELEASE_DIGEST" candidate.br
        shell: bash
      - name: Run cited acceptance through packed CLI
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'import {createReadStream,createWriteStream} from "node:fs"; import {pipeline} from "node:stream/promises"; import {createBrotliDecompress} from "node:zlib"; await pipeline(createReadStream("candidate.br"),createBrotliDecompress(),createWriteStream("candidate.sqlite",{flags:"wx"}))'
          archives=(packed-tool/*.tgz)
          test "${#archives[@]}" = 1 && test -f "${archives[0]}"
          vpx scripts/acceptance.ts "${archives[0]}" candidate.sqlite tests/fixtures/acceptance.json

  promote:
    needs: [candidate, acceptance]
    runs-on: ubuntu-latest
    environment: database-publication
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Promote only the verified draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATABASE_RELEASE_AUTHORIZATION: ${{ secrets.DATABASE_RELEASE_AUTHORIZATION }}
          RELEASE_ID: ${{ needs.candidate.outputs.id }}
          RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
          RELEASE_DIGEST: ${{ needs.candidate.outputs.digest }}
        run: node scripts/database-release.mjs promote "$RELEASE_ID" "$RELEASE_TAG" "$RELEASE_DIGEST"
