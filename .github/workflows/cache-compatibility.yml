name: Cache compatibility

on:
  push:
    branches:
      - feature/22-ticket-43-cache
      - feature/22-ticket-44-updates
      - feature/22-ticket-51-install-docs
      - feature/22-review-fixes
      - main

permissions:
  contents: read

jobs:
  acquisition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24.15.0', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: vp pack
      - run: vp test --testTimeout 30000 --hookTimeout 60000 tests/acquisition.test.ts tests/package-install.test.ts tests/search.test.ts tests/import-interface.test.ts tests/release-gate.test.ts tests/sql.test.ts
