name: Cache compatibility

on:
  push:
    branches:
      - feature/22-ticket-43-cache
      - feature/22-ticket-44-updates
      - feature/22-ticket-51-install-docs
      - feature/22-review-fixes
      - main

permissions:
  contents: read

jobs:
  acquisition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24.15.0', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-manager: false
          cache: false
      - run: node --version
      - name: Enable ARM64 execution
        if: runner.os == 'Linux' && matrix.node == '24.15.0'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Probe ARM64 execution
        if: runner.os == 'Linux' && matrix.node == '24.15.0'
        run: test "$(docker run --rm --platform linux/arm64 --entrypoint uname mysql@sha256:106d5197fd8e4892980469ad42eb20f7a336bd81509aae4ee175d852f5cc4565 -m)" = aarch64
      - run: vp run build
      - run: vp test tests/acquisition.test.ts tests/package-install.test.ts tests/search.test.ts tests/import-interface.test.ts tests/release-gate.test.ts tests/sql.test.ts
