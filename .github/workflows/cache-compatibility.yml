name: Cache compatibility

on:
  push:
    branches: [main]

permissions: {}

jobs:
  acquisition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24.15.0', '26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: vp pack
      - run: vp test --testTimeout 30000 --hookTimeout 60000 tests/server/acquisition.test.ts tests/release/package-install.test.ts tests/server/search.test.ts tests/build/interface.test.ts tests/release/release-gate.test.ts tests/server/sql.test.ts
