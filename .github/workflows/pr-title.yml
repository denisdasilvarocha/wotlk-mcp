name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: [^[:space:]].*$'
          [[ "$TITLE" =~ $pattern ]] || {
            echo "::error::PR title must be a Conventional Commit, e.g. 'feat(cli): add --json flag'"
            exit 1
          }
